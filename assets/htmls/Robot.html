<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robots Game — Polished Version</title>
  <style>
    :root {
      --cell-size:50px;
      --rows:11;
      --cols:11;
      --team1-color: #d95f5f;
      --team2-color: #5f9bd9;
      --open-color: #98fb98; /* light green */
      --block-color: #8b4513; /* brown */
      --exit-color: #d1f0ff; /* exit squares color */
      --text-color: #ffffff;
      --border-color: #444;
    }
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
      background: #f0f0f0;
      color: #222;
    }
    .layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .sidebar {
      flex: 1 1 380px;
      min-width: 320px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--cell-size));
      grid-template-rows: repeat(var(--rows), var(--cell-size));
      border: 2px solid #333;
      flex: 0 0 auto; /* keep board at intrinsic size */
    }
    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      box-sizing: border-box;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-weight: bold;
      font-size: 1.2em;
    }
    .open {
      background-color: var(--open-color);
    }
    .block {
      background-color: var(--block-color);
    }
    .exit {
      background-color: var(--exit-color);
    }
    .robot {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      position: relative;
    }
    .robot .id-label {
      z-index: 1;
    }
    .robot .arrow {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 12px solid rgba(255,255,255,0.95); /* triangle pointing down by default */
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
      transform-origin: 50% 75%;
    }
    .team1 {
      background-color: var(--team1-color);
    }
    .team2 {
      background-color: var(--team2-color);
    }
    .controls {
      margin-top:10px;
    }
    textarea.moves {
      width:100%;
      height: 1.8em; /* roughly one line of text */
      line-height: 1.2;
      font-family: monospace;
      box-sizing: border-box;
      resize: none; /* prevent vertical resize */
      overflow-y: hidden; /* hide scrollbar for single line */
    }
    .move-count {
      font-size:0.9em;
      color:#555;
      margin-top:4px;
    }
    button {
      padding:8px 12px;
      margin-right:6px;
      border-radius:4px;
      border:1px solid #888;
      background:#fff;
      cursor:pointer;
    }
    button:disabled {
      opacity:0.5;
      cursor:not-allowed;
    }
    .status, .log {
      margin-top:15px;
      background:white;
      border:1px solid #bbb;
      border-radius:6px;
      padding:8px;
      max-height:200px;
      overflow:auto;
      font-family: monospace;
      font-size:0.9em;
    }

    /* Celebration overlay */
    #celebrate {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none; /* toggled to flex when active */
      align-items: center;
      justify-content: center;
      z-index: 9999;
      text-align: center;
    }
    #celebrate .content {
      color: #fff;
      text-shadow: 0 4px 12px rgba(0,0,0,0.35);
      animation: pop-in 600ms ease-out;
      padding: 16px 24px;
    }
    #celebrate .title {
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 900;
      letter-spacing: 2px;
    }
    #celebrate .subtitle {
      margin-top: 12px;
      font-size: clamp(16px, 2.2vw, 24px);
      opacity: 0.9;
    }
    @keyframes pop-in {
      0% { transform: scale(0.85); opacity: 0; }
      60% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>Robots Game — Polished Version</h1>
  <div class="topbar">
    <label>Dice: <span id="diceVal">—</span></label>
    <button id="rollBtn">Roll & Execute</button>
    <button id="fastBtn">Fast Execute</button>
    <button id="resetBtn">Reset</button>
  </div>

  <!-- Celebration Overlay -->
  <div id="celebrate">
    <div class="content">
      <div id="celebrate-title" class="title">Team Wins!</div>
      <div class="subtitle">Click anywhere or press Reset to play again</div>
    </div>
  </div>

  <div class="layout">
    <div id="board"></div>

    <div class="controls sidebar">
      <div>
        <label>Robot 1 Moves:</label>
        <textarea id="moves1" class="moves" maxlength="10" placeholder="Up to 10 moves: F, B, L, R"></textarea>
        <div class="move-count" id="count1">0/10</div>
      </div>
      <div>
        <label>Robot 2 Moves:</label>
        <textarea id="moves2" class="moves" maxlength="10"></textarea>
        <div class="move-count" id="count2">0/10</div>
      </div>
      <div>
        <label>Robot 3 Moves:</label>
        <textarea id="moves3" class="moves" maxlength="10"></textarea>
        <div class="move-count" id="count3">0/10</div>
      </div>
      <div>
        <label>Robot 4 Moves:</label>
        <textarea id="moves4" class="moves" maxlength="10"></textarea>
        <div class="move-count" id="count4">0/10</div>
      </div>
      <div>
        <label>Robot 5 Moves:</label>
        <textarea id="moves5" class="moves" maxlength="10"></textarea>
        <div class="move-count" id="count5">0/10</div>
      </div>
      <div>
        <label>Robot 6 Moves:</label>
        <textarea id="moves6" class="moves" maxlength="10"></textarea>
        <div class="move-count" id="count6">0/10</div>
      </div>

      <div class="status" id="status">Ready to play.</div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <!-- Sound effects placeholders – put actual .wav/.mp3 files in same folder -->
  <audio id="moveSound" src="move.wav"></audio>
  <audio id="turnSound" src="turn.wav"></audio>
  <audio id="collisionSound" src="collision.wav"></audio>
  <audio id="exitSound" src="exit.wav"></audio>
  <audio id="diceSound" src="dice.wav"></audio>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script>
    const rows = 11, cols = 11;
    const boardEl = document.getElementById('board');
    const diceValEl = document.getElementById('diceVal');
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    const moveSound = document.getElementById('moveSound');
    const turnSound = document.getElementById('turnSound');
    const collisionSound = document.getElementById('collisionSound');
    const exitSound = document.getElementById('exitSound');
    const diceSound = document.getElementById('diceSound');

    let cells = []; // matrix: "open", "block", "exit"
    let robots = {}; // robot states
    let busy = false;

    function coordKey(r,c){ return r + ',' + c; }
    function inBoard(r,c){ return r>=0 && r<rows && c>=0 && c<cols; }

    const blockPositions = [
      [2,2], [2,3], [2,7], [2,8],
      [3,5],
      [5,2], [5,8],
      [6,2], [6,3], [6,7], [6,8],
      [8,5]
    ];
    const exitPositions = [
      [10,4], [10,5], [10,6], [10,7]
    ];

    function makeCells(){
      cells = [];
      for(let r=0; r<rows; r++){
        const row = [];
        for(let c=0; c<cols; c++){
          let type = 'open';
          for(const b of blockPositions){
            if(b[0]===r && b[1]===c){
              type = 'block';
              break;
            }
          }
          for(const ex of exitPositions){
            if(ex[0]===r && ex[1]===c){
              type = 'exit';
              break;
            }
          }
          row.push(type);
        }
        cells.push(row);
      }
    }

    function resetGame(){
      robots = {};
      const startCols = [2,3,4,5,6,7];
      for(let i=1;i<=6;i++){
        robots[i] = {
          id: i,
          r: 0,
          c: startCols[i-1],
          dir: 2, // facing south
          alive: true,
          off: false,
          team: i <= 3 ? 1 : 2,
          lastMoveWasStep: false
        };
      }
      logEl.innerHTML = '';
      statusEl.textContent = 'Game reset.';
      diceValEl.textContent = '—';
      // hide celebration overlay on reset
      const cel = document.getElementById('celebrate');
      if(cel) cel.style.display = 'none';
      render();
    }

    function log(msg){
      logEl.innerHTML += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(msg){
      statusEl.textContent = msg;
    }

    function setDice(v){
      diceValEl.textContent = v;
    }

    function parseMoves(text){
      if(!text) return [];
      const arr = text.toUpperCase().replace(/[^FBLR]/g,'').split('').slice(0,10);
      return arr;
    }

    function getMoves(id){
      return parseMoves(document.getElementById('moves' + id).value);
    }

    function forwardPos(rob, dir){
      const DR = [-1,0,1,0];
      const DC = [0,1,0,-1];
      return { r: rob.r + DR[dir], c: rob.c + DC[dir] };
    }
    function backPos(rob, dir){
      const DR = [-1,0,1,0];
      const DC = [0,1,0,-1];
      const d = (dir + 2) % 4;
      return { r: rob.r + DR[d], c: rob.c + DC[d] };
    }

    function cellIsEmpty(r,c){
      if(!inBoard(r,c)) return false;
      if(cells[r][c] === 'block') return false;
      for(const id in robots){
        const rr = robots[id];
        if(rr.alive && !rr.off && rr.r===r && rr.c===c){
          return false;
        }
      }
      return true;
    }

    function robotAt(r,c){
      for(const id in robots){
        const rr = robots[id];
        if(rr.alive && !rr.off && rr.r===r && rr.c===c){
          return rr;
        }
      }
      return null;
    }

    async function executeTurn(startDice, stepDelay=300){
      if(busy) return;
      busy = true;
      // Dice sound
      diceSound && diceSound.play();
      setDice(startDice);
      setStatus('Execut­ing turn starting at robot '+ startDice);
      log(`\n--- Turn: dice ${startDice} order ---`);
      const order = [];
      for(let i=0;i<6;i++){
        const id = ((startDice - 1 + i) % 6) + 1;
        order.push(id);
      }
      const movesMap = {};
      for(let id=1; id<=6; id++){
        movesMap[id] = getMoves(id);
        robots[id].lastMoveWasStep = false;
      }

      for(const id of order){
        const rob = robots[id];
        if(!rob.alive || rob.off) continue;
        const moves = movesMap[id];
        if(moves.length === 0){
          log(`Robot ${id} has no moves.`);
          continue;
        }
        log(`Robot ${id} moves: ${moves.join('')}`);
        for(const m of moves){
          if(!rob.alive) break;
          if(m==='L' || m==='R'){
            // Swap meaning: L turns right, R turns left
            rob.dir = (m==='L') ? (rob.dir + 1) % 4 : (rob.dir + 3) % 4;
            rob.lastMoveWasStep = false;
            // turn sound
            turnSound && turnSound.play();
            log(`  ${id}: turn ${m}, now dir ${rob.dir}`);
          } else if(m==='F' || m==='B'){
            const target = (m==='F') ? forwardPos(rob, rob.dir) : backPos(rob, rob.dir);
            const tr = target.r, tc = target.c;
            if(!inBoard(tr,tc)){
              log(`  ${id}: move ${m} blocked (off board)`);
              rob.lastMoveWasStep = false;
            } else if(cells[tr][tc] === 'exit' && cellIsEmpty(tr,tc)){
              rob.r = tr; rob.c = tc;
              rob.alive = false; rob.off = true;
              // exit sound
              exitSound && exitSound.play();
              log(`  ${id}: moved to exit at ${tr},${tc} — removed`);
              render();
              await sleep(stepDelay);
              break;
            } else {
              if(cellIsEmpty(tr,tc)){
                rob.r = tr; rob.c = tc;
                rob.lastMoveWasStep = true;
                // move sound
                moveSound && moveSound.play();
                log(`  ${id}: moved ${m} to ${tr},${tc}`);
              } else {
                const occupant = robotAt(tr,tc);
                if(occupant && rob.lastMoveWasStep){
                  const beyond = { r: occupant.r + (tr - rob.r), c: occupant.c + (tc - rob.c) };
                  if(inBoard(beyond.r,beyond.c) && cellIsEmpty(beyond.r,beyond.c) && cells[beyond.r][beyond.c] !== 'exit'){
                    occupant.r = beyond.r; occupant.c = beyond.c;
                    rob.r = tr; rob.c = tc;
                    // move sound for shunt
                    moveSound && moveSound.play();
                    log(`  ${id} shunts robot ${occupant.id} → ${beyond.r},${beyond.c}`);
                    rob.lastMoveWasStep = false;
                  } else {
                    log(`  ${id}: shunt blocked`);
                    rob.lastMoveWasStep = false;
                  }
                } else {
                  log(`  ${id}: move ${m} blocked`);
                  rob.lastMoveWasStep = false;
                }
              }
            }
          } else {
            log(`  ${id}: ignoring invalid move ${m}`);
            rob.lastMoveWasStep = false;
          }
          render();
          await sleep(stepDelay);
        }

        // collisions
        const posMap = {};
        for(const rid in robots){
          const r2 = robots[rid];
          if(r2.alive && !r2.off){
            const k = coordKey(r2.r, r2.c);
            if(!posMap[k]) posMap[k]=[];
            posMap[k].push(r2.id);
          }
        }
        for(const k in posMap){
          if(posMap[k].length > 1){
            const [rr,cc] = k.split(',').map(n=>parseInt(n));
            log(`Collision at ${rr},${cc} between robots ${posMap[k].join(',')} — removed`);
            // collision sound
            collisionSound && collisionSound.play();
            for(const rid of posMap[k]){
              robots[rid].alive = false;
              robots[rid].off = true;
            }
            render();
            await sleep(stepDelay);
          }
        }

        // victory?
        const counts = {1:0,2:0};
        for(const rid in robots){
          const r2 = robots[rid];
          if(r2.team===1 && r2.off) counts[1]++;
          if(r2.team===2 && r2.off) counts[2]++;
        }
        if(counts[1] === 3 || counts[2] === 3){
          const winner = counts[1]===3 ? 1 : 2;
          log(`\n=== Team ${winner} wins! ===`);
          setStatus(`Team ${winner} wins!`);
          showCelebration(winner);
          busy = false;
          return;
        }
      }

      busy = false;
      setStatus('Turn complete.');
      log('Turn complete.');
    }

    function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

    function setupMoveCount(id){
      const ta = document.getElementById('moves' + id);
      const countEl = document.getElementById('count' + id);
      ta.addEventListener('input', ()=>{
        let v = ta.value.toUpperCase().replace(/[^FBLR]/g,'');
        if(v.length > 10) v = v.slice(0,10);
        ta.value = v;
        countEl.textContent = `${v.length}/10`;
      });
    }

    document.getElementById('rollBtn').addEventListener('click', ()=>{
      const d = Math.floor(Math.random()*6)+1;
      executeTurn(d, 400);
    });
    document.getElementById('fastBtn')?.addEventListener('click', ()=>{
      const d = Math.floor(Math.random()*6)+1;
      executeTurn(d, 150);
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      if(busy) return;
      makeCells();
      resetGame();
    });

    function render(){
      boardEl.innerHTML = '';
      for(let r=0; r<rows; r++){
        for(let c=0; c<cols; c++){
          const cellType = cells[r][c];
          const cell = document.createElement('div');
          cell.classList.add('cell');
          if(cellType === 'block'){
            cell.classList.add('block');
          } else if(cellType === 'exit'){
            cell.classList.add('exit');
          } else {
            cell.classList.add('open');
          }
          const rob = robotAt(r,c);
          if(rob){
            const robEl = document.createElement('div');
            robEl.classList.add('robot');
            robEl.classList.add(rob.team === 1 ? 'team1' : 'team2');

            // centered ID label
            const idEl = document.createElement('div');
            idEl.classList.add('id-label');
            idEl.textContent = rob.id;
            robEl.appendChild(idEl);

            // arrow indicating direction: dir 0=N,1=E,2=S,3=W
            const arrow = document.createElement('div');
            arrow.classList.add('arrow');
            // Flip orientation by 180° from previous mapping
            const deg = (rob.dir * 90) % 360; // 0:N->0°, 1:E->90°, 2:S->180°, 3:W->270°
            arrow.style.transform = `rotate(${deg}deg)`;
            robEl.appendChild(arrow);

            cell.appendChild(robEl);
          }
          boardEl.appendChild(cell);
        }
      }
    }

    // initialize
    (function init(){
      makeCells();
      resetGame();
      // set up move count for each robot
      for(let i=1;i<=6;i++) setupMoveCount(i);
    })();

    // Celebration logic
    function showCelebration(team){
      const cel = document.getElementById('celebrate');
      const title = document.getElementById('celebrate-title');
      if(cel && title){
        title.textContent = `Team ${team} Wins!`;
        cel.style.display = 'flex';
        // Close on click
        cel.onclick = () => { cel.style.display = 'none'; };
      }
      // Confetti bursts for 3 seconds
      const duration = 3000;
      const end = Date.now() + duration;
      (function frame(){
        // Two side bursts
        if(window.confetti){
          confetti({ particleCount: 120, angle: 60, spread: 55, origin: { x: 0 } });
          confetti({ particleCount: 120, angle: 120, spread: 55, origin: { x: 1 } });
          // Center pop
          confetti({ particleCount: 80, spread: 70, origin: { x: 0.5, y: 0.4 } });
        }
        if(Date.now() < end){
          requestAnimationFrame(frame);
        }
      })();
    }

  </script>

</body>
</html>
